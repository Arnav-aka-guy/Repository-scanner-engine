<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="How it works: Scan, Parse, Graph, Index, Ask and Diagram">
  <defs>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .card { animation: lit 10s infinite; }
      .s1 { animation-delay: 0s } .s2 { animation-delay: 2s } .s3 { animation-delay: 4s } .s4 { animation-delay: 6s } .s5 { animation-delay: 8s }
      @keyframes lit {
        0%, 22%, 100% { stroke: #2c333d; }
        4%, 18% { stroke: #F2A93B; }
      }
      .glow { opacity: 0; animation: glow 10s infinite; }
      @keyframes glow { 0%, 22%, 100% { opacity: 0 } 4%, 18% { opacity: 1 } }
      .flow { stroke-dasharray: 6 10; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      .pkt { animation: move 10s linear infinite; }
      @keyframes move { from { transform: translateX(0) } to { transform: translateX(960px) } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1015"/><stop offset="1" stop-color="#141922"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="230" rx="18" fill="url(#bg)"/>
  <line x1="120" y1="104" x2="1080" y2="104" stroke="#2c333d" stroke-width="2"/>
  <line x1="120" y1="104" x2="1080" y2="104" stroke="#F2A93B" stroke-opacity=".55" stroke-width="2" class="flow"/>
  <circle cx="120" cy="104" r="5" fill="#F2A93B" class="pkt"/>

  <g class="t">
    <!-- 1 Scan -->
    <g>
      <rect x="40" y="44" width="160" height="120" rx="14" fill="#F2A93B" fill-opacity=".07" class="glow"/>
      <rect x="40" y="44" width="160" height="120" rx="14" fill="#171b22" fill-opacity=".92" stroke="#2c333d" stroke-width="1.6" class="card s1"/>
      <text x="62" y="72" class="m" font-size="11" fill="#F2A93B">01</text>
      <text x="62" y="100" font-size="18" font-weight="700" fill="#E6EAF0">Scan</text>
      <text x="62" y="124" font-size="12" fill="#8a928b">local folder or</text>
      <text x="62" y="141" font-size="12" fill="#8a928b">public GitHub URL</text>
    </g>
    <!-- 2 Parse -->
    <g>
      <rect x="280" y="44" width="160" height="120" rx="14" fill="#F2A93B" fill-opacity=".07" class="glow s2"/>
      <rect x="280" y="44" width="160" height="120" rx="14" fill="#171b22" fill-opacity=".92" stroke="#2c333d" stroke-width="1.6" class="card s2"/>
      <text x="302" y="72" class="m" font-size="11" fill="#5B8DEF">02</text>
      <text x="302" y="100" font-size="18" font-weight="700" fill="#E6EAF0">Parse</text>
      <text x="302" y="124" font-size="12" fill="#8a928b">AST: imports, classes,</text>
      <text x="302" y="141" font-size="12" fill="#8a928b">functions, docstrings</text>
    </g>
    <!-- 3 Graph -->
    <g>
      <rect x="520" y="44" width="160" height="120" rx="14" fill="#F2A93B" fill-opacity=".07" class="glow s3"/>
      <rect x="520" y="44" width="160" height="120" rx="14" fill="#171b22" fill-opacity=".92" stroke="#2c333d" stroke-width="1.6" class="card s3"/>
      <text x="542" y="72" class="m" font-size="11" fill="#4CAF79">03</text>
      <text x="542" y="100" font-size="18" font-weight="700" fill="#E6EAF0">Graph</text>
      <text x="542" y="124" font-size="12" fill="#8a928b">dependency, call and</text>
      <text x="542" y="141" font-size="12" fill="#8a928b">symbol graphs</text>
    </g>
    <!-- 4 Index -->
    <g>
      <rect x="760" y="44" width="160" height="120" rx="14" fill="#F2A93B" fill-opacity=".07" class="glow s4"/>
      <rect x="760" y="44" width="160" height="120" rx="14" fill="#171b22" fill-opacity=".92" stroke="#2c333d" stroke-width="1.6" class="card s4"/>
      <text x="782" y="72" class="m" font-size="11" fill="#7CC4C9">04</text>
      <text x="782" y="100" font-size="18" font-weight="700" fill="#E6EAF0">Index</text>
      <text x="782" y="124" font-size="12" fill="#8a928b">FAISS vectors +</text>
      <text x="782" y="141" font-size="12" fill="#8a928b">BM25 keywords</text>
    </g>
    <!-- 5 Understand -->
    <g>
      <rect x="1000" y="44" width="160" height="120" rx="14" fill="#F2A93B" fill-opacity=".07" class="glow s5"/>
      <rect x="1000" y="44" width="160" height="120" rx="14" fill="#171b22" fill-opacity=".92" stroke="#2c333d" stroke-width="1.6" class="card s5"/>
      <text x="1022" y="72" class="m" font-size="11" fill="#9580CA">05</text>
      <text x="1022" y="100" font-size="18" font-weight="700" fill="#E6EAF0">Understand</text>
      <text x="1022" y="124" font-size="12" fill="#8a928b">ask, search, score,</text>
      <text x="1022" y="141" font-size="12" fill="#8a928b">draw system design</text>
    </g>
  </g>
  <text x="600" y="204" text-anchor="middle" class="m" font-size="12" fill="#5b6470">rescans only re-parse files whose SHA-256 hash changed</text>
</svg>
